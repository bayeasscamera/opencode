name: lint

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # `bun run lint` is oxlint with .oxlintrc.json (type-aware rules). It reports warnings
      # only, so this gate fails on errors; tighten with --deny-warnings once the warning
      # backlog is cleared.
      - name: Run oxlint
        run: bun run lint

      # .husky/pre-commit formats staged files, but a hook can be bypassed with --no-verify and a
      # fresh clone has no hook until `prepare` runs. This step reports formatting drift on the
      # files a pull request touches, using the same extension and path filters as the hook.
      #
      # It is ADVISORY (continue-on-error) because the branch backlog is not formatted yet: at
      # 67 commits, 30 of the 122 files this branch changes predate the hook. Remove
      # `continue-on-error` once that backlog is cleared, which turns this into a real gate:
      #
      #   xargs bunx prettier --write -- < the file list this step prints
      - name: Report formatting drift on changed files (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "No new commits to check"
            exit 0
          fi
          git diff --name-only "$base...HEAD" \
            | grep -E '\.(js|jsx|ts|tsx|json|jsonc|css|md|mdx|yml|yaml|html)$' \
            | grep -vE '(^|/)(dist|out|gen|generated|node_modules)/|\.gen\.(ts|tsx)$|^packages/sdk/openapi\.json$' \
            > changed.txt || true
          if [ ! -s changed.txt ]; then
            echo "No formattable files changed"
            exit 0
          fi
          echo "$(wc -l < changed.txt) formattable file(s) changed"
          xargs bunx prettier --check -- < changed.txt
